<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>preclipped</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px/1.2 Arial,sans-serif}</style></head>
<body><main id="main"><p class="fresh" style="width:20em;height:2.4em;overflow:hidden;margin:0;background:#eee">Two short lines of text fit in this box at normal spacing.</p><p class="old" style="width:20em;height:2.4em;overflow:hidden;margin:0;background:#eef">This second notice fits in two lines until the spacing overrides make every line taller and the words wider.</p></main></body></html>
