<!doctype html>
<html lang="sl">
<head><meta charset="utf-8"><title>keyboard-ok</title><style>:focus-visible{outline:3px solid #005fcc}</style></head>
<body>
<div class="menu" role="button" tabindex="0" aria-expanded="false" style="display:inline-block;padding:.5rem;cursor:pointer">Meni</div>
<script>var m=document.querySelector('.menu');function t(){m.setAttribute('aria-expanded',m.getAttribute('aria-expanded')==='true'?'false':'true')}m.addEventListener('click',t);m.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}});</script>
</body>
</html>
