<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-content</title>
<style>*{box-sizing:border-box}body{font:16px/1.4 Arial,Helvetica,sans-serif;color:#222;background:#fff;margin:0;padding:0 1rem}
.skip{position:absolute;left:-9999px}.skip:focus{left:1rem;top:1rem;background:#fff;padding:.5rem}
header,nav,main,footer{max-width:60rem;margin:0 auto;padding:.5rem 0}nav a{margin-right:1rem}
a{color:#0b3d91}
:focus-visible{outline:3px solid #005fcc;outline-offset:2px}
.tip{position:relative;display:inline-block}.bubble{display:none;position:absolute;left:0;background:#fff;color:#222;border:1px solid #222;padding:.5rem;width:14rem}.bubble{top:100%}.tip:hover .bubble,.tip:focus-within .bubble{display:block}.tip.dismissed .bubble{display:none!important}</style>
</head>
<body>
<a class="skip" href="#main">Preskoči na vsebino</a>
<nav aria-label="Glavna navigacija"><a href="index.html">Domov</a><a href="index.html">Izdelki</a></nav>
<main id="main">
<h1>hover-content</h1>
<span class="tip"><button type="button" class="help" aria-describedby="b1">Pomoč</button><span class="bubble" id="b1" role="tooltip">Cena vsebuje DDV.</span></span>
</main>
<script>document.addEventListener("keydown",function(e){if(e.key==="Escape"){document.querySelector(".tip").classList.add("dismissed")}});document.querySelector(".tip").addEventListener("mouseleave",function(){this.classList.remove("dismissed")});</script></body>
</html>
