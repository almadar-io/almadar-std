<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>carousel</title>
<style>*{box-sizing:border-box}body{font:16px/1.4 Arial,Helvetica,sans-serif;color:#222;background:#fff;margin:0;padding:0 1rem}
.skip{position:absolute;left:-9999px}.skip:focus{left:1rem;top:1rem;background:#fff;padding:.5rem}
header,nav,main,footer{max-width:60rem;margin:0 auto;padding:.5rem 0}nav a{margin-right:1rem}
a{color:#0b3d91}
:focus-visible{outline:3px solid #005fcc;outline-offset:2px}
.slide{padding:2rem;background:#eef}</style>
</head>
<body>
<a class="skip" href="#main">Preskoči na vsebino</a>
<nav aria-label="Glavna navigacija"><a href="index.html">Domov</a><a href="index.html">Izdelki</a></nav>
<main id="main">
<h1>carousel</h1>
<div class="carousel" aria-roledescription="carousel" aria-label="Akcije"><div class="slide" id="s">Akcija 1: -10 % na lonce</div><button type="button" id="pause" aria-pressed="false">Premor</button></div>
<script>var i=0,items=["Akcija 1: -10 % na lonce","Akcija 2: brezplačna dostava","Akcija 3: nove skodelice"],paused=false;
setInterval(function(){if(paused)return;i=(i+1)%items.length;document.getElementById("s").textContent=items[i];},2000);
document.getElementById("pause").addEventListener("click",function(){paused=!paused;this.setAttribute("aria-pressed",paused);this.textContent=paused?"Nadaljuj":"Premor";});</script>
</main>
</body>
</html>
