<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>widgets-tabs</title>
<style>*{box-sizing:border-box}body{font:16px/1.4 Arial,Helvetica,sans-serif;color:#222;background:#fff;margin:0;padding:0 1rem}
.skip{position:absolute;left:-9999px}.skip:focus{left:1rem;top:1rem;background:#fff;padding:.5rem}
header,nav,main,footer{max-width:60rem;margin:0 auto;padding:.5rem 0}nav a{margin-right:1rem}
a{color:#0b3d91}
:focus-visible{outline:3px solid #005fcc;outline-offset:2px}
.tab{padding:.5rem 1rem;border:1px solid #444;display:inline-block;background:#eee}.panel[hidden]{display:none}</style>
</head>
<body>
<a class="skip" href="#main">Preskoči na vsebino</a>
<nav aria-label="Glavna navigacija"><a href="index.html">Domov</a><a href="index.html">Izdelki</a></nav>
<main id="main">
<h1>widgets-tabs</h1>
<div role="tablist" aria-label="Podrobnosti"><button role="tab" class="tab" id="t1" aria-selected="true" aria-controls="p1" tabindex="0">Opis</button><button role="tab" class="tab" id="t2" aria-selected="false" aria-controls="p2" tabindex="-1">Dostava</button></div>
<div role="tabpanel" class="panel" id="p1" aria-labelledby="t1" tabindex="0"><p>Opis izdelka.</p></div>
<div role="tabpanel" class="panel" id="p2" aria-labelledby="t2" tabindex="0" hidden><p>Dostava v 3 dneh.</p></div>
<script>var tabs=Array.prototype.slice.call(document.querySelectorAll('[role=tab]'));
function sel(t){tabs.forEach(function(x){var on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;document.getElementById(x.getAttribute('aria-controls')).hidden=!on});t.focus();}
tabs.forEach(function(t,i){t.addEventListener('click',function(){sel(t)});t.addEventListener('keydown',function(e){var j=i;if(e.key==='ArrowRight')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft')j=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;else return;e.preventDefault();sel(tabs[j]);});});</script>
</main>
</body>
</html>
