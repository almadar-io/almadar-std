<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>media-extra</title></head>
<body>
<main id="main">
<video id="loud" autoplay controls width="320" preload="metadata"><source src="media/clip.mp4" type="video/mp4"><track kind="captions" src="media/clip.sl.vtt" srclang="sl"><track kind="descriptions" src="media/clip.sl.vtt" srclang="sl"></video>
<video id="quiet" autoplay muted controls width="320" preload="metadata"><source src="media/clip.mp4" type="video/mp4"><track kind="subtitles" src="media/clip.sl.vtt" srclang="sl"><track kind="descriptions" src="media/clip.sl.vtt" srclang="sl"></video>
<audio id="podcast" controls src="media/clip.mp4"></audio>
<audio id="podcast2" controls src="media/clip.mp4" aria-describedby="tr"></audio>
<div id="tr">Transcript of the episode.</div>
<iframe id="yt" src="https://www.youtube.com/embed/abc" title="clip"></iframe>
<iframe id="map" src="https://example.com/map" title="map"></iframe>
</main></body></html>
