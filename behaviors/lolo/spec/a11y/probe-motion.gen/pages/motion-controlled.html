<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>motion-controlled</title>
<style>@keyframes spin{to{transform:rotate(360deg)}}#spin{width:20px;height:20px;background:#c00;animation:spin 1s linear infinite}#spin.off{animation-play-state:paused}
#slider{position:relative;left:0;width:100px;background:#ccf}</style></head>
<body><main id="main">
<div id="spin"></div><button type="button" id="pause" aria-controls="spin" aria-pressed="false">Pause</button>
<div id="slider">slides</div>
<script>var n=0;setInterval(function(){n+=10;document.getElementById("slider").style.left=n+"px";},500);
document.getElementById("pause").addEventListener("click",function(){document.getElementById("spin").classList.toggle("off");});</script>
</main></body></html>
