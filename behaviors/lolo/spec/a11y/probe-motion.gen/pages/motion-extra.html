<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>motion-extra</title>
<style>#slider{position:relative;left:0;width:100px;background:#ccf}#still{position:relative;left:10px;width:100px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes blip{to{opacity:.5}}
#spin{width:20px;height:20px;background:#c00;animation:spin 1s linear infinite}@keyframes fade{to{opacity:.5}}#long{width:20px;height:20px;background:#00c;animation:fade 6s linear 1}#medium{width:20px;height:20px;background:#0cc;animation:fade 4s linear 1}#brief{width:20px;height:20px;background:#0a0;animation:blip 1s linear 2}</style></head>
<body><main id="main">
<div id="slider">slides</div><div id="still">still</div><div id="spin"></div><div id="brief"></div><div id="long"></div><div id="medium"></div>
<marquee id="news">news</marquee>
<script>var n=0;setInterval(function(){n+=10;document.getElementById("slider").style.left=n+"px";},500);</script>
</main></body></html>
